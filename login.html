<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Spelling Bee - Login</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">

    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">

    <link href="css/sb-admin-2.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background:
                linear-gradient(rgba(255, 224, 102, 0.88),
                    rgba(255, 193, 7, 0.88)),
                url("img/fondo-margaritas.png") center/cover no-repeat;
        }

        .login-card {
            max-width: 430px;
            width: 100%;
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .form-group label {
            font-size: 1rem;
            font-weight: 700;
            color: #4e4e5d;
            margin-bottom: 0.5rem;
        }

        .form-control {
            height: 52px;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
        }

        .btn-user {
            font-size: 1.05rem;
            font-weight: 700;
            padding: 0.8rem 1rem;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="card login-card shadow-lg border-0">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <img src="img/bee.png" class="login-logo mb-3" alt="Spelling Bee">

                            <h1 class="h3 font-weight-bold text-gray-900 mb-2">
                                Spelling Bee
                            </h1>

                            <p class="text-muted font-weight-bold">
                                Sign in to continue
                            </p>

                        </div>

                        <div id="loginError" class="alert alert-danger d-none" role="alert">
                            Incorrect username or password.
                        </div>

                        <form id="loginForm">

                            <div class="form-group">

                                <label for="username">
                                    Username
                                </label>

                                <input type="text" class="form-control form-control-user" id="username"
                                    autocomplete="username" required autofocus>

                            </div>

                            <div class="form-group">

                                <label for="password">
                                    Password
                                </label>

                                <input type="password" class="form-control form-control-user" id="password"
                                    autocomplete="current-password" required>

                            </div>

                            <button type="submit" class="btn btn-primary btn-user btn-block" id="loginButton">
                                <i class="fas fa-sign-in-alt mr-2"></i>
                                Login
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
